<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#103b5d">
<title>MPI Informatika — Apa Itu Informatika?</title>
<style>
:root{--navy:#103b5d;--blue:#1677a8;--teal:#0c9488;--gold:#f2b84b;--ink:#172b3a;--muted:#5c7180;--paper:#f4f8fb;--line:#dce7ee;--good:#137547;--bad:#a43d35}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(140deg,#e8f4fb,#f7fbfd 55%,#e8f8f5);min-height:100vh}
button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:750;transition:transform .12s,filter .12s}button:hover{filter:brightness(.97);transform:translateY(-1px)}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.primary{background:var(--blue);color:white}.secondary{background:#e6f0f6;color:var(--navy)}.teal{background:var(--teal);color:white}.quiet{background:transparent;color:var(--navy);border:1px solid var(--line)}.small{padding:8px 11px;font-size:.92rem}
.app{max-width:1100px;margin:auto;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;color:var(--navy)}.brand-icon{width:42px;height:42px;border-radius:13px;background:var(--navy);color:white;display:grid;place-items:center;font-size:1.35rem}.top-actions{display:flex;gap:8px;flex-wrap:wrap}
main{min-height:70vh}.panel{background:#fff;border:1px solid #e1ebf1;border-radius:24px;padding:clamp(18px,4vw,36px);box-shadow:0 14px 40px #244a6410}.hero{background:linear-gradient(135deg,#103b5d,#146c8d 68%,#0c9488);color:white;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:290px;height:290px;border-radius:50%;right:-90px;top:-95px;background:#ffffff10;border:25px solid #ffffff0d}.eyebrow{font-size:.8rem;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:#d2efff}.hero h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;margin:12px 0}.hero p{font-size:1.1rem;max-width:650px;color:#e5f6ff}.hero-content{position:relative;z-index:1;max-width:760px}.hero-art{font-size:clamp(3rem,9vw,6rem);margin:22px 0 12px;letter-spacing:.1em}.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.hero .primary{background:#f5c65e;color:#18334a}.menu-grid,.concept-grid,.image-grid,.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.menu-card{border:1px solid var(--line);border-radius:18px;padding:20px;text-align:left;background:#fff;min-height:150px;color:var(--ink)}.menu-card .emoji{font-size:2rem}.menu-card h3{margin:10px 0 4px;color:var(--navy)}.menu-card p{margin:0;color:var(--muted);font-size:.95rem}.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}.section-head h2{margin:0;color:var(--navy);font-size:clamp(1.5rem,4vw,2.25rem)}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:999px;padding:5px 10px;background:#e7f4fa;color:#145b7d;font-size:.82rem;font-weight:800}.concept-card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}.concept-art{min-height:145px;display:grid;place-items:center;font-size:4rem;background:linear-gradient(135deg,#d9eef9,#e8f8f4);position:relative}.concept-art span{filter:drop-shadow(0 5px 3px #1233)}.concept-body{padding:17px}.concept-body h3{margin:0 0 7px;color:var(--navy)}.concept-body p{margin:0;color:var(--muted);line-height:1.5}.concept-card button{margin:14px 17px 17px}.callout{background:#eef8fb;border-left:4px solid var(--teal);padding:15px 17px;border-radius:10px;line-height:1.6}.stepper{display:flex;gap:7px;flex-wrap:wrap}.step{padding:7px 10px;border-radius:999px;background:#edf2f5;color:#536b79;font-size:.86rem;font-weight:800}.step.active{background:var(--navy);color:#fff}.task{background:#f7fafc;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}.task h3{margin:0 0 8px}.radio-option{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;background:white;cursor:pointer}.radio-option:has(input:checked){border-color:var(--blue);background:#eef8fc}.radio-option input{margin-top:5px;accent-color:var(--blue)}.feedback{margin-top:12px;padding:13px;border-radius:12px;line-height:1.5}.feedback.good{background:#e9f8ef;color:#145d36}.feedback.bad{background:#fff1ed;color:#8e3029}.progress{height:8px;background:#e7eef2;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--teal);transition:width .2s}.score{font-size:3rem;font-weight:900;color:var(--navy);text-align:center}.profile-list{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.footer{padding:18px 5px;color:var(--muted);font-size:.82rem;text-align:center}.hide{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:640px){.app{padding:10px}.topbar{align-items:flex-start}.brand{font-size:.9rem}.top-actions button{padding:8px 10px}.menu-grid,.concept-grid,.image-grid,.options{grid-template-columns:1fr}.panel{border-radius:18px}.profile-list{grid-template-columns:1fr;gap:2px}.concept-art{min-height:115px}.hero-art{margin:14px 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brand-icon" aria-hidden="true">⌘</div><div>MPI INFORMATIKA<br><span class="muted" style="font-size:.78rem;font-weight:650">SMPN 12 Kolaka Utara</span></div></div>
  <div class="top-actions"><button class="quiet small" id="audioToggle" aria-pressed="false" title="Aktifkan atau nonaktifkan suara">🔇 Suara</button><button class="quiet small" id="homeTop">⌂ Beranda</button></div>
</header>
<main id="screen" aria-live="polite"></main>
<footer class="footer">Media Pembelajaran Interaktif · Informatika Kelas VII · Fase D · Berjalan secara offline</footer>
</div>
<script>
"use strict";
const state={screen:"splash",audio:false,activeImage:0,seen:[],matched:[],simIndex:0,simChoice:"",simFeedback:null,quizIndex:0,quizAnswers:{},quizFeedback:false,quizFinished:false};
const concepts=[
 {id:"computer",emoji:"💻",title:"1. Sistem Komputer",short:"Perangkat untuk mengolah dan menyajikan informasi.",detail:"Komputer bekerja bersama perangkat keras dan perangkat lunak untuk menerima masukan, mengolah data, lalu menghasilkan keluaran. Informatika mempelajari bagaimana sistem komputasi bekerja dan digunakan untuk menyelesaikan masalah.",example:"Contoh: menggunakan aplikasi pengolah kata untuk menyusun laporan kegiatan kelas."},
 {id:"data",emoji:"📊",title:"2. Data dan Informasi",short:"Mengolah fakta agar menjadi informasi yang bermakna.",detail:"Data adalah fakta yang dikumpulkan. Setelah diolah, data dapat menjadi informasi yang membantu kita memahami keadaan atau mengambil keputusan.",example:"Contoh: data nilai siswa disusun menjadi tabel dan grafik agar hasil belajar mudah dibandingkan."},
 {id:"algorithm",emoji:"🧩",title:"3. Algoritma dan Berpikir Komputasional",short:"Memecahkan masalah dengan langkah logis dan terurut.",detail:"Berpikir komputasional membantu kita memahami masalah, membaginya menjadi bagian kecil, menemukan pola, lalu merancang langkah penyelesaian. Urutan instruksi tersebut disebut algoritma.",example:"Contoh: menyusun langkah untuk mengumpulkan tugas digital atau membagi jadwal piket secara adil."},
 {id:"network",emoji:"🌐",title:"4. Jaringan dan Komunikasi Digital",short:"Perangkat bertukar informasi melalui koneksi.",detail:"Jaringan memungkinkan perangkat saling terhubung dan bertukar data. Pengguna perlu berkomunikasi dengan sopan, memeriksa informasi, serta menjaga data pribadi.",example:"Contoh: mengirim tugas kepada guru melalui platform pembelajaran sekolah."},
 {id:"ethics",emoji:"🔐",title:"5. Keamanan dan Dampak Sosial",short:"Menggunakan teknologi dengan aman dan bertanggung jawab.",detail:"Informatika juga mengajak kita memahami dampak teknologi bagi manusia. Kita perlu melindungi kata sandi, menghormati privasi, memeriksa kebenaran informasi, dan menghargai karya orang lain.",example:"Contoh: tidak membagikan kata sandi atau meneruskan pesan mencurigakan tanpa memeriksa sumbernya."}
];
const simItems=[
 {id:"IMG_SIM_01",emoji:"📈",title:"Tabel nilai menjadi grafik",desc:"Siswa mencatat nilai kelas lalu menyajikannya dalam grafik.",answer:"data",why:"Tabel dan grafik membantu mengolah serta memahami data."},
 {id:"IMG_SIM_02",emoji:"🪜",title:"Langkah kegiatan yang terurut",desc:"Siswa menuliskan langkah-langkah untuk mengumpulkan tugas.",answer:"algoritma",why:"Urutan instruksi yang jelas merupakan contoh algoritma."},
 {id:"IMG_SIM_03",emoji:"📡",title:"Mengirim tugas melalui jaringan",desc:"Siswa mengirim berkas menggunakan platform pembelajaran.",answer:"network",why:"Perangkat dan jaringan memungkinkan informasi dikirim kepada pengguna lain."},
 {id:"IMG_SIM_04",emoji:"🔒",title:"Melindungi akun digital",desc:"Siswa merahasiakan kata sandi dan memeriksa tautan.",answer:"ethics",why:"Menjaga akun dan data pribadi adalah bagian dari keamanan dan tanggung jawab digital."}
];
const categories=[{id:"data",label:"Mengolah data menjadi informasi"},{id:"algoritma",label:"Menyusun algoritma"},{id:"network",label:"Berkomunikasi melalui jaringan"},{id:"ethics",label:"Menjaga keamanan digital"}];
const questions=[
 {q:"Gambar manakah yang paling jelas menunjukkan kegiatan mengolah data?",emoji:"📊",opts:["Siswa menghias sampul buku","Siswa membuat grafik dari tabel nilai","Siswa menyiram tanaman","Siswa menyusun kursi"],answer:1,why:"Grafik yang dibuat dari tabel nilai menunjukkan data yang diolah menjadi informasi."},
 {q:"Seorang siswa membuat langkah-langkah terurut untuk mengumpulkan tugas digital. Konsep apakah yang diterapkan?",emoji:"🧩",opts:["Algoritma","Dekorasi","Olahraga","Seni rupa"],answer:0,why:"Algoritma adalah urutan langkah yang dirancang untuk menyelesaikan masalah."},
 {q:"Saat menerima tautan yang mencurigakan, tindakan paling tepat adalah …",emoji:"🔐",opts:["Langsung membuka tautan","Membagikannya ke semua teman","Memeriksa sumber dan tidak memasukkan data pribadi sembarangan","Mengirimkan kata sandi"],answer:2,why:"Periksa sumber dan jangan memasukkan informasi pribadi ke tautan yang tidak tepercaya."}
];
function el(id){return document.getElementById(id)}
function go(screen){state.screen=screen;render();window.scrollTo({top:0,behavior:"smooth"})}
function btn(label,action,cls="primary"){return `<button class="${cls}" data-action="${action}">${label}</button>`}
function topHeader(title,sub=""){return `<div class="section-head"><div><span class="pill">JELAJAH DUNIA INFORMATIKA</span><h2 style="margin-top:10px">${title}</h2>${sub?`<p class="muted">${sub}</p>`:""}</div></div>`}
function splash(){return `<section class="panel hero"><div class="hero-content"><div class="eyebrow">MEDIA PEMBELAJARAN INTERAKTIF · FASE D</div><div class="hero-art" aria-hidden="true">💻 📊 🌐</div><h1>Apa Itu<br>Informatika?</h1><p>Mengenal Informatika melalui gambar di sekitar kita. Amati, coba, dan temukan bagaimana Informatika membantu kehidupan sehari-hari.</p><p style="font-weight:800">Informatika Kelas VII · SMPN 12 Kolaka Utara</p><div class="btnrow">${btn("Mulai Belajar →","menu","primary")} ${btn("Lihat tujuan belajar","go-objectives","secondary")}</div></div></section><section class="panel" style="margin-top:14px"><h3>Setelah belajar, kamu diharapkan mampu:</h3><ul><li>Menjelaskan pengertian Informatika dengan kata-kata sendiri.</li><li>Mengenali penerapan Informatika melalui gambar.</li><li>Menjelaskan alasan dan menggunakan teknologi secara bertanggung jawab.</li></ul></section>`}
function menu(){return `${topHeader("Selamat datang, penjelajah!","Pilih kegiatan belajarmu. Kamu dapat kembali ke menu kapan saja.")}<section class="panel"><div class="menu-grid">
<button class="menu-card" data-action="materi"><div class="emoji">📚</div><h3>Materi</h3><p>Kenali konsep Informatika melalui gambar dan contoh.</p></button>
<button class="menu-card" data-action="simulasi"><div class="emoji">🧩</div><h3>Simulasi</h3><p>Cocokkan gambar dengan penerapan yang tepat.</p></button>
<button class="menu-card" data-action="kuis"><div class="emoji">🎯</div><h3>Kuis Interaktif</h3><p>Jawab tiga soal dan lihat hasil belajarmu.</p></button>
<button class="menu-card" data-action="profil"><div class="emoji">🏫</div><h3>Profil</h3><p>Informasi tentang media pembelajaran ini.</p></button>
</div><div class="callout" style="margin-top:18px">💡 <strong>Tips:</strong> Mulailah dari Materi, lanjutkan ke Simulasi, lalu uji pemahamanmu melalui Kuis.</div></section>`}
function materi(){const c=concepts[state.activeImage];return `${topHeader("Apa Itu Informatika?","Pilih kartu untuk mempelajari berbagai contoh dan konsep.")}<div class="stepper" style="margin-bottom:15px">${concepts.map((x,i)=>`<button class="step ${i===state.activeImage?"active":""}" data-action="concept-${i}">${i+1}. ${x.title.replace(/^\\d\\. /,"")}</button>`).join("")}</div><section class="panel"><div class="concept-grid"><article class="concept-card"><div class="concept-art"><span>${c.emoji}</span></div><div class="concept-body"><span class="pill">KONSEP ${state.activeImage+1} DARI ${concepts.length}</span><h3>${c.title}</h3><p>${c.short}</p></div></article><div><h3 style="color:var(--navy)">Apa makna gambar ini?</h3><p style="line-height:1.7">${c.detail}</p><div class="callout"><strong>Contoh di sekitar kita</strong><br>${c.example}</div><p class="muted" style="font-size:.9rem">Ingat: Informatika bukan hanya menggunakan komputer. Informatika juga mencakup cara berpikir, data, algoritma, sistem komputasi, jaringan, dan dampak teknologi.</p></div></div><div class="btnrow">${btn("← Sebelumnya","concept-prev","secondary")}${btn("Berikutnya →","concept-next","primary")}${btn("Coba Simulasi","simulasi","teal")}</div><div class="progress" style="margin-top:18px"><div style="width:${(state.seen.length/concepts.length)*100}%"></div></div><p class="muted" style="font-size:.82rem">${state.seen.length} dari ${concepts.length} konsep telah dibuka</p></section>`}
function simulasi(){const item=simItems[state.simIndex];return `${topHeader("Simulasi: Cocokkan Gambar","Pilih gambar, lalu pilih kategori yang paling sesuai. Baca umpan balik untuk mengetahui alasannya.")}<section class="panel"><div class="stepper" style="margin-bottom:16px">${simItems.map((x,i)=>`<button class="step ${i===state.simIndex?"active":""}" data-action="sim-index-${i}">${state.matched.includes(x.id)?"✓ ":""}Gambar ${String.fromCharCode(65+i)}</button>`).join("")}</div><div class="concept-grid"><div class="concept-card"><div class="concept-art"><span>${item.emoji}</span></div><div class="concept-body"><h3>${item.title}</h3><p>${item.desc}</p></div></div><div><h3 style="margin-top:0">Pasangkan dengan konsep</h3>${categories.map(cat=>`<label class="radio-option"><input type="radio" name="simcat" value="${cat.id}" ${state.simChoice===cat.id?"checked":""}> <span>${cat.label}</span></label>`).join("")}<div id="simFeedback">${state.simFeedback?feedbackHtml(state.simFeedback.ok,state.simFeedback.text):""}</div></div></div><div class="btnrow">${btn("Periksa pasangan","check-sim","primary")}${btn("← Gambar sebelumnya","sim-prev","secondary")}${btn("Gambar berikutnya →","sim-next","secondary")}</div><div style="margin-top:18px"><div class="progress"><div style="width:${state.matched.length/4*100}%"></div></div><p class="muted">${state.matched.length} dari 4 pasangan benar</p></div>${state.matched.length===4?`<div class="callout"><strong>Hebat!</strong> Semua gambar berhasil dipasangkan. Sekarang coba kuis untuk menguji pemahamanmu.<div class="btnrow">${btn("Lanjut ke Kuis →","kuis","teal")}</div></div>`:""}</section>`}
function feedbackHtml(ok,text){return `<div class="feedback ${ok?"good":"bad"}">${ok?"✓ Benar!":"↻ Coba lagi."} ${text}</div>`}
function kuis(){if(state.quizFinished){const correct=questions.filter((q,i)=>state.quizAnswers[i]===q.answer).length;const score=Math.round(correct/questions.length*100);return `${topHeader("Hasil Kuis","Kamu sudah menyelesaikan tiga soal.")}<section class="panel"><div class="score">${score}/100</div><p style="text-align:center;font-weight:800">${correct} dari 3 jawaban benar</p><div class="callout">${score===100?"Luar biasa! Semua jawaban benar.":score>=67?"Bagus! Pelajari kembali penjelasan soal yang belum tepat.":"Tetap semangat! Baca kembali materi, lalu coba lagi."}</div><h3>Ulasan jawaban</h3>${questions.map((q,i)=>`<div class="task"><strong>${i+1}. ${q.q}</strong><p>${state.quizAnswers[i]===q.answer?"✓ Benar":"Jawaban benar: "+q.opts[q.answer]}</p><p class="muted">${q.why}</p></div>`).join("")}<div class="btnrow">${btn("Ulangi Kuis","retry-quiz","primary")}${btn("Kembali ke Menu","menu","secondary")}</div></section>`}
const q=questions[state.quizIndex];return `${topHeader("Kuis Interaktif","Baca soal, pilih satu jawaban, lalu periksa hasilnya.")}<section class="panel"><div class="stepper"><span class="step active">Soal ${state.quizIndex+1} dari ${questions.length}</span><span class="step">10 poin per jawaban benar</span></div><div class="progress" style="margin:14px 0 20px"><div style="width:${(state.quizIndex+1)/questions.length*100}%"></div></div><div class="concept-art" style="border-radius:16px;margin-bottom:18px"><span>${q.emoji}</span></div><h3>${q.q}</h3>${q.opts.map((opt,i)=>`<label class="radio-option"><input type="radio" name="quizans" value="${i}" ${state.quizAnswers[state.quizIndex]===i?"checked":""}> <span><strong>${String.fromCharCode(65+i)}.</strong> ${opt}</span></label>`).join("")}<div id="quizFeedback">${state.quizFeedback?feedbackHtml(state.quizAnswers[state.quizIndex]===q.answer,q.why):""}</div><div class="btnrow">${btn("Periksa Jawaban","check-quiz","primary")}${state.quizFeedback?(state.quizIndex<2?btn("Soal Berikutnya →","next-quiz","teal"):btn("Lihat Hasil","finish-quiz","teal")):""}${state.quizIndex>0?btn("← Sebelumnya","prev-quiz","secondary"):""}</div><p class="muted" style="font-size:.85rem">Skor dihitung otomatis di perangkat ini. Tidak memerlukan internet.</p></section>`}
function profil(){return `${topHeader("Profil Media","Informasi singkat tentang MPI yang sedang digunakan.")}<section class="panel"><div style="font-size:4rem;text-align:center">🏫 💻 📚</div><h3 style="text-align:center;color:var(--navy)">Apa Itu Informatika?</h3><p style="text-align:center" class="muted">Media Pembelajaran Interaktif</p><div class="profile-list"><strong>Satuan pendidikan</strong><span>SMPN 12 Kolaka Utara</span></div><div class="profile-list"><strong>Mata pelajaran</strong><span>Informatika</span></div><div class="profile-list"><strong>Kelas / Fase</strong><span>VII / D</span></div><div class="profile-list"><strong>Kurikulum</strong><span>Kurikulum Merdeka</span></div><div class="profile-list"><strong>Materi</strong><span>Apa Itu Informatika — pengenalan melalui gambar</span></div><div class="callout" style="margin-top:18px">MPI ini dirancang untuk pembelajaran kontekstual. Nama guru/pengembang dan logo resmi sekolah dapat ditambahkan sesuai data yang telah disetujui sekolah.</div><div class="btnrow">${btn("Kembali ke Menu","menu","primary")}</div></section>`}
function objectives(){return `${topHeader("Tujuan Pembelajaran","Hal-hal yang akan kamu pelajari.")}<section class="panel"><ol><li>Menjelaskan pengertian Informatika dengan kata-kata sendiri.</li><li>Mengenali contoh penerapan Informatika dalam kehidupan sehari-hari.</li><li>Membedakan pengolahan data, algoritma, jaringan, dan keamanan digital.</li><li>Memberikan alasan atas pilihan serta menggunakan teknologi secara bertanggung jawab.</li></ol><div class="callout">Pertanyaan pemantik: <strong>Apakah semua kegiatan yang menggunakan komputer termasuk Informatika? Mengapa?</strong></div><div class="btnrow">${btn("Mulai Belajar →","menu","primary")}</div></section>`}
function render(){const root=el("screen");switch(state.screen){case"splash":root.innerHTML=splash();break;case"menu":root.innerHTML=menu();break;case"materi":if(!state.seen.includes(state.activeImage))state.seen.push(state.activeImage);root.innerHTML=materi();break;case"simulasi":root.innerHTML=simulasi();break;case"kuis":root.innerHTML=kuis();break;case"profil":root.innerHTML=profil();break;case"objectives":root.innerHTML=objectives();break;default:root.innerHTML=menu();}}
function resetQuiz(){state.quizIndex=0;state.quizAnswers={};state.quizFeedback=false;state.quizFinished=false}
function speak(text){if(!state.audio||!("speechSynthesis"in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="id-ID";u.rate=.94;window.speechSynthesis.speak(u)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;
if(a==="menu")go("menu");else if(a==="go-objectives")go("objectives");else if(a==="materi"){state.activeImage=0;go("materi");speak("Mari mengenal Informatika melalui gambar.");}else if(a==="simulasi"){state.simFeedback=null;state.simChoice="";go("simulasi");}else if(a==="kuis"){resetQuiz();go("kuis");}else if(a==="profil")go("profil");
else if(a.startsWith("concept-")&&/^concept-\\d+$/.test(a)){state.activeImage=Number(a.split("-")[1]);go("materi");speak(concepts[state.activeImage].title+". "+concepts[state.activeImage].detail);}
else if(a==="concept-next"){state.activeImage=(state.activeImage+1)%concepts.length;go("materi");speak(concepts[state.activeImage].title+". "+concepts[state.activeImage].detail);}
else if(a==="concept-prev"){state.activeImage=(state.activeImage-1+concepts.length)%concepts.length;go("materi");}
else if(a.startsWith("sim-index-")){state.simIndex=Number(a.split("-")[2]);state.simChoice="";state.simFeedback=null;render();}
else if(a==="sim-prev"){state.simIndex=(state.simIndex+simItems.length-1)%simItems.length;state.simChoice="";state.simFeedback=null;render();}
else if(a==="sim-next"){state.simIndex=(state.simIndex+1)%simItems.length;state.simChoice="";state.simFeedback=null;render();}
else if(a==="check-sim"){const selected=document.querySelector('input[name="simcat"]:checked');if(!selected){state.simFeedback={ok:false,text:"Pilih kategori terlebih dahulu."};}else{state.simChoice=selected.value;const item=simItems[state.simIndex];const ok=selected.value===item.answer;if(ok&&!state.matched.includes(item.id))state.matched.push(item.id);state.simFeedback={ok,text:ok?item.why:"Pikirkan fungsi utama pada gambar, lalu pilih kategori yang sesuai."};}render();}
else if(a==="check-quiz"){const selected=document.querySelector('input[name="quizans"]:checked');if(selected)state.quizAnswers[state.quizIndex]=Number(selected.value);if(state.quizAnswers[state.quizIndex]===undefined){state.quizFeedback=false;render();return;}state.quizFeedback=true;render();}
else if(a==="next-quiz"){state.quizIndex=Math.min(2,state.quizIndex+1);state.quizFeedback=false;render();}
else if(a==="prev-quiz"){state.quizIndex=Math.max(0,state.quizIndex-1);state.quizFeedback=false;render();}
else if(a==="finish-quiz"){state.quizFinished=true;go("kuis");}
else if(a==="retry-quiz"){resetQuiz();go("kuis");}
});
document.addEventListener("change",e=>{if(e.target.name==="simcat"){state.simChoice=e.target.value;state.simFeedback=null;}});
el("homeTop").addEventListener("click",()=>go("menu"));
el("audioToggle").addEventListener("click",()=>{state.audio=!state.audio;el("audioToggle").textContent=state.audio?"🔊 Suara":"🔇 Suara";el("audioToggle").setAttribute("aria-pressed",String(state.audio));if(!state.audio&&"speechSynthesis"in window)window.speechSynthesis.cancel();else speak("Audio narasi diaktifkan.");});
render();
</script>
</body>
</html>
